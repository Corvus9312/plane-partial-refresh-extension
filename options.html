<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plane 局部刷新 — 設定</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --bg: #ffffff;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #f3f4f6;
        --muted: #9ca3af;
        --border: #374151;
        --bg: #111827;
        --accent: #60a5fa;
      }
    }
    body {
      margin: 0;
      padding: 24px;
      font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
      color: var(--fg);
      background: var(--bg);
      max-width: 420px;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0 0 8px;
    }
    p.hint {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 13px;
    }
    label.row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0;
      cursor: pointer;
    }
    select {
      margin-left: 4px;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: inherit;
    }
    .saved {
      margin-top: 16px;
      font-size: 13px;
      color: var(--accent);
      min-height: 1.2em;
    }
    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>Plane 局部刷新設定</h1>
  <p class="hint">
    在 Plane 分頁點工具列上的擴充套件圖示即可手動局部刷新。
    下列開關通常設一次即可，會套用到所有 Plane 分頁。
  </p>

  <label class="row">
    <input type="checkbox" id="autoEnabled">
    <span>定時刷新</span>
  </label>
  <label class="row">
    <span>間隔</span>
    <select id="autoSeconds">
      <option value="60">1 分</option>
      <option value="180">3 分</option>
      <option value="300" selected>5 分</option>
      <option value="600">10 分</option>
      <option value="1800">30 分</option>
    </select>
  </label>

  <hr>

  <label class="row">
    <input type="checkbox" id="focusEnabled">
    <span>回來自動刷新</span>
  </label>
  <label class="row">
    <span>距上次刷新至少</span>
    <select id="minGapSeconds">
      <option value="30">30 秒</option>
      <option value="60" selected>1 分</option>
      <option value="180">3 分</option>
      <option value="300">5 分</option>
      <option value="600">10 分</option>
    </select>
    <span>才會在回來時再刷</span>
  </label>

  <div class="saved" id="status" aria-live="polite"></div>
  <script src="options.js"></script>
</body>
</html>
